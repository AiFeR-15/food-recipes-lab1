<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style/base.css">
    <link rel="stylesheet" href="style/layout.css">
    <link rel="stylesheet" href="style/modules.css">
    <link rel="stylesheet" href="style/states.css">
    <link rel="stylesheet" href="style/themes.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="body">

    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="header__logo">CookBooks</a>
            <nav class="main-nav">
                <a href="index.html" class="main-nav__link">Home</a>
                <a href="recipes.html" class="main-nav__link main-nav__link--active">Recipes</a>
                <a href="about.html" class="main-nav__link">About us</a>
            </nav>
                <a href="profile.html" class="header__profile" aria-label="Profile">
                    <img src="media/profile-icon.png" alt="Profile Icon" class="header__profile-img">
                </a>
        </div>
    </header>

    <section class="hero-banner">
        <div class="hero-banner__content">
            <h2>Unleash your inner chef</h2>
            <p>Discover a world of culinary delights as you explore a treasure trove of diverse recipes.</p>
            <!-- Поле пошуку -->
            <label for="search" class="visually-hidden">Пошук:</label>
            <input type="search" id="search-input" class="hero-banner__search" placeholder="search recipes">
        </div>
    </section>

    <section class="recipes-grid">

        <article class="recipe-card">
            <img class="recipe-card__image" src="media/waffle.jpg" alt="BlueBerry Waffle">
            
            <!-- Нижній блок картки (який потім буде помаранчевим із закругленнями) -->
            <div class="recipe-card__info">
                <h3 class="recipe-card__title">BlueBerry Waffle</h3>
                <!-- Іконка годинника та час -->
                <span class="recipe-card__time">⏱ 15-20 min</span>
            </div>
        </article>

        <!-- Картка 2 -->
        <article class="recipe-card">
            <img class="recipe-card__image" src="media/egg.jpg" alt="Egg Pouch">
            
            <div class="recipe-card__info">
                <h3 class="recipe-card__title">Egg Pouch</h3>
                <span class="recipe-card__time">⏱ 5-10 min</span>
            </div>
        </article>

        <!-- Картка 3 -->
        <article class="recipe-card">
            <img class="recipe-card__image" src="media/nachos.jpg" alt="Nachos With Mayo">
            
            <div class="recipe-card__info">
                <h3 class="recipe-card__title">Nachos With Mayo</h3>
                <span class="recipe-card__time">⏱ 25-30 min</span>
            </div>
        </article>

        <!-- Тут можна додавати інші картки за таким самим шаблоном -->
    </section>
</body>
</html>
