<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style/main.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookBooks</title>
</head>
<body class="body">

    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="header__logo">CookBooks</a>

            <!-- Звичайне меню (на ПК в рядок, на телефоні виїжджає при натисканні на 3 полосочки) -->
            <nav class="main-nav">
                <a href="index.html" class="main-nav__link main-nav__link--active">Home</a>
                <a href="recipes.html" class="main-nav__link">Recipes</a>
                
                <div class="dropdown">
                    <a role="button" tabindex="0" class="main-nav__link">About us 
                        <span class="dropdown__arrow">
                            <img src="media/arrow-down.png" alt="Відкрити меню">
                        </span>
                    </a>
                    <div class="dropdown__menu">
                        <a href="about.html" class="dropdown__item">Про нас</a>
                        <a href="#contact" class="dropdown__item">Як зв'язатися</a>
                        <a href="#complaints" class="dropdown__item">Скарги</a>
                        <a href="memes.html" class="dropdown__item">Мемі</a>
                        <a href="#info" class="dropdown__item">Звідки я</a>
                    </div>
                </div>
            </nav>

            <!-- Правий кут: іконка профілю + картинка трьох полосочок -->
            <div class="header__actions">
                <a href="#" class="header__profile" aria-label="Profile" data-bs-toggle="modal" data-bs-target="#authModal">
                    <img src="media/profile-icon.png" alt="Profile Icon" class="header__profile-img">
                </a>

                <button type="button" class="burger-btn" aria-label="Відкрити меню">
                    <img src="media/menu-icon.png" alt="Меню" class="burger-btn__img">
                </button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container hero__container">

            <div class="hero__content">
                <h2 class="text-gradient">Happy to serve!</h2>
                <p class="hero__subtitle">Where food becomes art, and the kitchen becomes home!</p>

                <div class="hero__actions">
                    <a href="#" class="button button--primary" data-bs-toggle="modal" data-bs-target="#authModal">
                        Register
                    </a>
                    <a href="recipes.html" class="button button--secondary">Explore</a>
                </div>
            </div>
            <div class="hero__media">
                <img class="hero__image" src="media/pizza.png" alt="Delicious Pizza">
            </div>
        </div>
    </section>

        <!-- Модальне вікно Bootstrap -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        
        <!-- Шапка вікна -->
        <div class="modal-header">
            <h5 class="modal-title" id="authModalLabel">Увійти / Зареєструватися</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <!-- Тіло вікна з формою -->
        <div class="modal-body">
            <form action="#" method="POST">
            <!-- Поле Email -->
            <div class="mb-3">
                <label for="userEmail" class="form-label">Email адреса</label>
                <input type="email" class="form-control" id="userEmail" placeholder="name@example.com" required>
            </div>
            
            <!-- Поле Пароль -->
            <div class="mb-4">
                <label for="userPassword" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="userPassword" placeholder="Введіть пароль" required>
            </div>
            
            <!-- Кнопка відправки -->
            <button type="submit" class="btn btn-primary w-100">Підтвердити</button>
            </form>
        </div>
        
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
